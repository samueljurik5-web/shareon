# Render Blueprint – ShareOn deployment (one web service; PostgreSQL on Neon).
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# Secrets are NOT stored here: JWT_SECRET is generated by Render, SEED_ADMIN_PASSWORD is entered in the dashboard.
# Database: Neon (neon.tech) free PostgreSQL – it does not expire like Render's free tier.
# Its connection string goes into DATABASE_URL in the Render dashboard (never in git).

services:
  - type: web
    name: shareon
    runtime: node
    plan: starter         # paid: always on, no cold start
    region: frankfurt
    branch: master        # deploy pushes to master
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: cd server && npx prisma migrate deploy && node dist/prisma/seed-if-empty.js && node dist/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                    # Neon connection string, entered in the dashboard
      - key: JWT_SECRET
        generateValue: true            # random secret generated by Render, never in git
      - key: SEED_ADMIN_PASSWORD
        sync: false                    # you type it in the dashboard (min. 12 chars)
      - key: DEMO_SEED_ON_EMPTY
        value: "true"                  # inserts demo data only if the database is empty
      - key: CLIENT_DIST_DIR
        value: ../client/dist          # Express serves the React build → one URL, no CORS
      - key: RATE_LIMIT_ENABLED
        value: "true"
