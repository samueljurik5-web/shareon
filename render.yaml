# Render Blueprint – ShareOn demo deployment (one web service + one PostgreSQL).
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# Secrets are NOT stored here: JWT_SECRET is generated by Render, SEED_ADMIN_PASSWORD is entered in the dashboard.
databases:
  - name: shareon-db
    plan: free            # free tier expires after 30 days; use basic-256mb (~$6/mo) to keep data
    region: frankfurt
    databaseName: shareon
    user: shareon

services:
  - type: web
    name: shareon
    runtime: node
    plan: free            # spins down after 15 min idle (~1 min cold start); starter (~$7/mo) stays on
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: cd server && npx prisma migrate deploy && node dist/prisma/seed-if-empty.js && node dist/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shareon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true            # random secret generated by Render, never in git
      - key: SEED_ADMIN_PASSWORD
        sync: false                    # you type it in the dashboard (min. 12 chars)
      - key: DEMO_SEED_ON_EMPTY
        value: "true"                  # inserts demo data only if the database is empty
      - key: CLIENT_DIST_DIR
        value: ../client/dist          # Express serves the React build → one URL, no CORS
      - key: RATE_LIMIT_ENABLED
        value: "true"
